<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>page-mascot</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 0%, #f7f4ef, #e7e2da);
        color: #1c1a17;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      main {
        padding: 48px 24px;
        width: min(560px, 100%);
      }

      h1 {
        margin: 0 0 4px;
        font-size: 32px;
        letter-spacing: -0.02em;
      }

      .lede {
        margin: 0 0 32px;
        color: #6c665c;
      }

      .tree {
        margin: 0;
        padding: 0;
        list-style: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 15px;
      }

      .tree li {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 3px 0;
      }

      .branch {
        color: #b3aca1;
        user-select: none;
      }

      .tree a {
        color: #1c1a17;
        text-decoration: none;
        border-bottom: 1px solid #c9c2b6;
      }

      .tree a:hover {
        color: #b4541e;
        border-bottom-color: #b4541e;
      }

      .asset {
        color: #a9a297;
      }

      .note {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #8d8579;
        font-size: 13px;
      }

      .root {
        color: #6c665c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>page-mascot</h1>
      <p class="lede">Chibi mascots that watch your cursor.</p>

      <ul class="tree">
        <li><span class="root">page-mascot/</span></li>
        <li>
          <span class="branch">&#9500;&#9472;&#9472;</span>
          <a href="portrait-quyen.html">portrait-quyen.html</a>
          <span class="note">one Quyen, centred</span>
        </li>
        <li>
          <span class="branch">&#9500;&#9472;&#9472;</span>
          <a href="wall-quyen.html?tile=100">wall-quyen.html</a>
          <span class="note">a full wall &mdash; try ?cols=8&amp;rows=5</span>
        </li>
        <li>
          <span class="branch">&#9500;&#9472;&#9472;</span>
          <a href="wall-thao.html?tile=100">wall-thao.html</a>
          <span class="note">a full wall &mdash; try ?tile=120</span>
        </li>
        <li>
          <span class="branch">&#9500;&#9472;&#9472;</span>
          <span class="asset">mascots/</span>
          <span class="note">3&times;3 direction atlases</span>
        </li>
        <li>
          <span class="branch">&#9492;&#9472;&#9472;</span>
          <span class="asset">characters/</span>
          <span class="note">source artwork</span>
        </li>
      </ul>
    </main>
  </body>
</html>
