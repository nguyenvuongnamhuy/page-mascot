<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quyen</title>
    <style>
      :root {
        --mascot-width: 240px;
        /* The atlas cells are 320x383, so the frame has to keep that ratio. */
        --mascot-height: calc(var(--mascot-width) * 383 / 320);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 0%, #f7f4ef, #e7e2da);
        color: #1c1a17;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        cursor: url('../assets/cursor.png') 6 4, auto;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 48px 24px;
        text-align: center;
      }

      .mascot {
        width: var(--mascot-width);
        height: var(--mascot-height);
        background-image: url('../mascots/quyen.png');
        background-size: 300% 300%;
        background-repeat: no-repeat;
        background-position: 50% 50%;
        filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.18));
      }

      h1 {
        margin: 16px 0 0;
        font-size: 40px;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: #6c665c;
      }

      .desktop-only {
        display: none;
      }

      /* No hoverable pointer means no cursor to follow, so the mascot is pointless. */
      @media (hover: none), (pointer: coarse) {
        main {
          display: none;
        }

        .desktop-only {
          display: grid;
          gap: 8px;
          padding: 32px 24px;
          text-align: center;
        }

        .desktop-only strong {
          font-size: 22px;
          letter-spacing: -0.01em;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mascot" role="img" aria-label="Quyen, watching the cursor"></div>
      <h1>Quyen</h1>
      <p>Move your cursor around &mdash; Quyen follows.</p>
    </main>

    <div class="desktop-only">
      <strong>Please open this on a computer</strong>
      <p>This page needs a mouse cursor to work.</p>
    </div>

    <script src="../scripts/mascot.js"></script>
    <script>
      Mascot.follow(document.querySelector('.mascot'))
    </script>
  </body>
</html>
