<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thao &mdash; page-mascot</title>
    <style>
      :root {
        --mascot-width: 240px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 0%, #f7f4ef, #e7e2da);
        color: #1c1a17;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 48px 24px;
        text-align: center;
      }

      /* The component sizes a square box, but the atlas cells are 320x383 --
         override the inline height so the head is not squashed. */
      .thao {
        height: calc(var(--mascot-width) * 383 / 320) !important;
        filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.18));
      }

      h1 {
        margin: 16px 0 0;
        font-size: 40px;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: #6c665c;
      }

      .desktop-only {
        display: none;
      }

      /* No hoverable pointer means no cursor to follow, so the mascot is pointless. */
      @media (hover: none), (pointer: coarse) {
        main {
          display: none;
        }

        .desktop-only {
          display: grid;
          gap: 8px;
          padding: 32px 24px;
          text-align: center;
        }

        .desktop-only strong {
          font-size: 22px;
          letter-spacing: -0.01em;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- inert: there is no reactions sheet for Thao, so the boop stays switched off. -->
      <div id="mascot" inert></div>
      <h1>Thao</h1>
      <p>Move your cursor around &mdash; Thao follows.</p>
    </main>

    <div class="desktop-only">
      <strong>Please open this on a computer</strong>
      <p>This page needs a mouse cursor to work.</p>
    </div>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
          "page-mascot": "https://esm.sh/page-mascot@0.1.0?external=react"
        }
      }
    </script>

    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { Mascot } from 'page-mascot'

      const SHEET = 'mascots/thao.png'

      createRoot(document.getElementById('mascot')).render(
        React.createElement(Mascot, {
          directions: SHEET,
          // Required by the component; never visible because the boop is disabled.
          reactions: SHEET,
          size: 240,
          label: 'Thao',
          className: 'thao',
        }),
      )
    </script>
  </body>
</html>
