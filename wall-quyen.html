<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quyen &times; n</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: #e7e2da;
      }

      #wall {
        display: grid;
        gap: 0;
      }

      .mascot {
        background-image: url('mascots/quyen.png');
        background-size: 300% 300%;
        background-repeat: no-repeat;
        background-position: 50% 50%;
      }

      .desktop-only {
        display: none;
      }

      /* No hoverable pointer means no cursor to follow, so the wall is pointless. */
      @media (hover: none), (pointer: coarse) {
        #wall {
          display: none;
        }

        .desktop-only {
          display: grid;
          gap: 8px;
          padding: 32px 24px;
          text-align: center;
          color: #1c1a17;
          font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        .desktop-only strong {
          font-size: 22px;
          letter-spacing: -0.01em;
        }

        .desktop-only span {
          color: #6c665c;
        }
      }
    </style>
  </head>
  <body>
    <div id="wall" role="img" aria-label="A wall of Quyens, all watching the cursor"></div>

    <div class="desktop-only">
      <strong>Please open this on a computer</strong>
      <span>This page needs a mouse cursor to work.</span>
    </div>

    <script>
      const CELL_RATIO = 383 / 320

      // Row-major cell indices on the 3x3 sheet, clockwise from the right,
      // matching atan2 with y pointing down.
      const CLOCKWISE = [5, 8, 7, 6, 3, 0, 1, 2]
      const SECTOR = (Math.PI * 2) / CLOCKWISE.length
      const CENTER = 4

      // ?cols=8&rows=5 pins the grid; ?tile=120 only sets the width and fills the viewport.
      const params = new URLSearchParams(location.search)
      const asNumber = (key) => {
        const value = Number(params.get(key))
        return Number.isFinite(value) && value > 0 ? Math.floor(value) : 0
      }

      const wall = document.getElementById('wall')
      let tiles = []
      let centers = []
      let pointer = null
      let queued = false
      let deadZone = 0

      const position = (index) =>
        `${(index % 3) * 50}% ${Math.floor(index / 3) * 50}%`

      const build = () => {
        const fixedCols = asNumber('cols')
        const fixedRows = asNumber('rows')
        const tileHint = asNumber('tile') || 150

        const cols = fixedCols || Math.max(1, Math.ceil(innerWidth / tileHint))
        const width = fixedCols ? tileHint : innerWidth / cols
        const height = width * CELL_RATIO
        const rows = fixedRows || Math.max(1, Math.ceil(innerHeight / height))

        wall.style.gridTemplateColumns = `repeat(${cols}, ${width}px)`
        wall.style.gridTemplateRows = `repeat(${rows}, ${height}px)`
        wall.replaceChildren(
          ...Array.from({ length: cols * rows }, () => {
            const tile = document.createElement('div')
            tile.className = 'mascot'
            return tile
          }),
        )

        tiles = [...wall.children].map((node) => ({ node, index: CENTER }))
        // Measured once per layout; the wall never scrolls or reflows on its own.
        centers = tiles.map(({ node }) => {
          const box = node.getBoundingClientRect()
          return { x: box.left + box.width / 2, y: box.top + box.height / 2 }
        })
        deadZone = width * 0.45
      }

      const aim = () => {
        queued = false
        if (!pointer) return

        for (let i = 0; i < tiles.length; i++) {
          const dx = pointer.x - centers[i].x
          const dy = pointer.y - centers[i].y
          const next =
            Math.hypot(dx, dy) < deadZone
              ? CENTER
              : CLOCKWISE[
                  (Math.round(Math.atan2(dy, dx) / SECTOR) + CLOCKWISE.length) %
                    CLOCKWISE.length
                ]

          if (next !== tiles[i].index) {
            tiles[i].index = next
            tiles[i].node.style.backgroundPosition = position(next)
          }
        }
      }

      if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
        build()
        addEventListener('resize', () => {
          build()
          aim()
        })
        addEventListener(
          'pointermove',
          (event) => {
            pointer = { x: event.clientX, y: event.clientY }
            if (queued) return
            queued = true
            requestAnimationFrame(aim)
          },
          { passive: true },
        )
      }
    </script>
  </body>
</html>
