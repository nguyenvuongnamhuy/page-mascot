<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thao &times; n</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: #e7e2da;
      }

      #wall {
        display: grid;
        gap: 0;
      }

      .mascot {
        background-image: url('mascots/thao.png');
        background-size: 300% 300%;
        background-repeat: no-repeat;
        background-position: 50% 50%;
      }

      .desktop-only {
        display: none;
      }

      /* No hoverable pointer means no cursor to follow, so the wall is pointless. */
      @media (hover: none), (pointer: coarse) {
        #wall {
          display: none;
        }

        .desktop-only {
          display: grid;
          gap: 8px;
          padding: 32px 24px;
          text-align: center;
          color: #1c1a17;
          font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        .desktop-only strong {
          font-size: 22px;
          letter-spacing: -0.01em;
        }

        .desktop-only span {
          color: #6c665c;
        }
      }
    </style>
  </head>
  <body>
    <div id="wall" role="img" aria-label="A wall of Thaos, all watching the cursor"></div>

    <div class="desktop-only">
      <strong>Please open this on a computer</strong>
      <span>This page needs a mouse cursor to work.</span>
    </div>

    <script src="scripts/mascot.js"></script>
    <script>
      Mascot.wall(document.getElementById('wall'), { cellRatio: 383 / 320 })
    </script>
  </body>
</html>
